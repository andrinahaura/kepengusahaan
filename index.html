<!doctype html>
<html lang="id">
<head>
<!-- @include head.html -->
<title>Data Kepengusahaan Aset Terminal — Kementerian Perhubungan</title>
<meta name="description" content="Data publik aset terminal, objek komersial, nilai sewa, proyek KSP dan KPBU, serta layanan Klinik Hub Kementerian Perhubungan.">
<script type="module" src="/src/pages/beranda.js"></script>
</head>
<body>

<!-- @include header.html -->

<main>

<!-- Hero: foto terminal (hitam-putih) + lapisan navy (primary dashboard).
     Foto: "Harapan Jaya buses", Juliyus Iyus, Wikimedia Commons, domain publik. Ganti file di public/hero.jpg bila perlu. -->
<section class="relative isolate overflow-hidden bg-primary text-primary-foreground">
  <img src="/hero.jpg" alt="" width="1920" height="1094" fetchpriority="high" class="absolute inset-0 -z-20 size-full object-cover object-[center_60%] grayscale">
  <div class="absolute inset-0 -z-10 bg-primary/80" aria-hidden="true"></div>
  <!-- Bagian bawah foto memudar (blur + gradasi ke navy) lalu berlanjut ke tepi atas peta. -->
  <div class="absolute inset-x-0 bottom-0 -z-10 h-24 backdrop-blur-md [mask-image:linear-gradient(to_bottom,transparent,black_75%)]" aria-hidden="true"></div>
  <div class="absolute inset-x-0 bottom-0 -z-10 h-24 bg-linear-to-b from-transparent via-primary/70 to-primary" aria-hidden="true"></div>
  <div class="wrap flex flex-col items-center pt-36 pb-24 text-center sm:pt-44">
    <h1 class="mx-auto max-w-5xl text-heading font-semibold sm:text-display lg:text-display-lg">Data kepengusahaan aset terminal</h1>
    <p class="mx-auto mt-6 max-w-2xl text-subheading text-primary-foreground/85">
      Aset terminal, objek komersial, nilai sewa, serta proyek kerja sama dan KPBU yang dikelola Direktorat Jenderal Perhubungan Darat.
    </p>
    <p class="mt-4 text-sm text-primary-foreground/70">Data per <span id="updatedAt"></span></p>
  </div>
</section>

<!-- KPI: setengah menumpang di tepi bawah hero. -->
<section class="relative z-10 -mt-14" aria-label="Ringkasan">
  <div class="wrap">
    <dl id="stats" class="card flex divide-x divide-border overflow-x-auto [scrollbar-width:none] lg:grid lg:grid-cols-6 lg:overflow-visible"></dl>
  </div>
</section>

<!-- Peta: selebar layar, ditarik ke atas sampai tepi bawah hero sehingga KPI menumpang di antara keduanya.
     Tepi atas peta memudar dari navy (menyambung hero), tepi bawah memudar ke warna latar. -->
<section id="peta" class="relative -mt-16">
  <div id="map" class="h-[100svh] min-h-[560px] w-full bg-muted" role="region" aria-label="Peta lokasi aset"></div>
  <!-- z-1: di atas kanvas & marker, di bawah kontrol MapLibre (z-2). -->
  <div class="pointer-events-none absolute inset-x-0 top-0 z-1 h-64 bg-linear-to-b from-primary via-primary/45 to-transparent" aria-hidden="true"></div>
  <div class="pointer-events-none absolute inset-x-0 bottom-0 z-1 hidden h-24 bg-linear-to-t from-background to-transparent lg:block" aria-hidden="true"></div>
  <!-- Daftar lokasi: di layar lebar menempel di atas peta (di bawah KPI), sejajar tepi kiri konten. -->
  <div class="relative z-2 lg:pointer-events-none lg:absolute lg:inset-x-0 lg:top-28">
    <div class="wrap">
      <div id="locPanel" class="mt-4 overflow-hidden rounded-card border border-border bg-card lg:pointer-events-auto lg:mt-0 lg:w-[300px]">
        <p class="flex items-center justify-between gap-3 border-b border-border px-5 py-3 text-xs font-semibold text-muted-foreground">Lokasi aset <span id="asetMeta" class="text-muted-foreground"></span></p>
        <ul id="locList" class="max-h-[320px] divide-y divide-border overflow-y-auto lg:max-h-[calc(100svh-16rem)]"></ul>
      </div>
    </div>
  </div>
</section>

</main>

<!-- @include footer.html -->
</body>
</html>
